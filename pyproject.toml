[project]
name = "planningpoker"
version = "0.1.0"
description = ""
authors = [{ name = "Oleksii Koval", email = "alex@koval.kharkov.ua" }]
requires-python = "~=3.11"
# readme = "README.md"
dependencies = [
    "fastapi[standard]>=0.112.1,<0.113",
    "google-auth>=2.33.0,<3",
    "authlib>=1.3.1,<2",
    "itsdangerous>=2.2.0,<3",
    "types-oauthlib>=3.2.0.20240806,<4",
    "python-dotenv>=1.0.1,<2",
    "pydantic-settings>=2.4.0,<3",
    "jira>=3.8.0,<4",
    "markdown~=3.7",
    "types-markdown>=3.7.0.20240822,<4",
    "websockets>=13.0.1,<14",
    "cachetools>=5.5.0,<6",
    "types-cachetools>=5.5.0.20240820,<6",
    "atlassian-python-api>=4.0.3",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "mypy>=1.11.2,<2",
    "ruff>=0.11.7",
    "types-cachetools>=5.5.0.20240820,<6",
    "types-requests-oauthlib>=2.0.0.20250306",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
# Same as Black.
line-length = 120
indent-width = 4
